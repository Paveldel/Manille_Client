<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <title>Manille</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/font.css">
    <link rel="stylesheet" href="assets/css/background.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="/assets/js/index.js" type="module"></script>
</head>
<body>
    <main class="background">
        <div class="vignette">
            <div class="main-menu">
                <img src="/images/logo.png" alt="logo" id="logo">
                <div class="play-options">
                    <form action="/" class="option" id="create-game">
                        <p>Create Game</p>
                        <label for="create-username">Username</label>
                        <input type="text" required placeholder="John Doe" id="create-username">
                        <input type="submit" value="Play">
                    </form>
                    <form action="/" class="option"id="join-game" >
                        <p>Join Game</p>
                        <label for="join-username">Username</label>
                        <input type="text" required placeholder="John Doe" id="join-username">
                        <label for="game-id">Game Id</label>
                        <input type="text" required placeholder="AB1CD2" id="game-id">
                        <input type="submit" value="Join">
                    </form>
                </div>
                <div class="error"></div>
            </div>
        </div>
    </main>
</body>
</html>
