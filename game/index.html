<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manille</title>
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/css/background.css">
    <link rel="stylesheet" href="/assets/css/game.css">
    <script src="/assets/js/game.js" type="module"></script>
</head>
<body>
    <main class="background">
        <div class="vignette">
            <div class="waiting">
                <div>Waiting for players...</div>
                <div></div>
            </div>
            <div class="wait-for-trump hidden">
                <p>Waiting for trump to be chosen...</p>
            </div>
            <div class="select-trump hidden">
                <p>Choose your trump suit:</p>
                <div class="trump-options">
                    <span data-trump="Spades">♠</span>
                    <span data-trump="Hearts">♥</span>
                    <span data-trump="Clubs">♣</span>
                    <span data-trump="Diamonds">♦</span>
                </div>
            </div>
            <div class="hand">
                
            </div>
            <div class="trick">

            </div>
            <button class="next hidden">Next</button>
        </div>
    </main>
</body>
</html>
